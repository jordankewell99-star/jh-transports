<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - J&H Transports</title>
  <link rel="stylesheet" href="assets/style/style.css">
</head>
<body>

  <div class="nav">
    <div class="brand">J&H Transports</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="booking.html">Booking</a>
      <a href="admin.html" class="active">Admin</a>
      <a href="report.html">Report</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <h2>Admin Page</h2>
      <p style="font-size:14px;color:gray;">Add routes to the system below.</p>

      <form id="routeForm">
        <label>Route Name</label>
        <input type="text" id="routeName" required>

        <label>Departure Time</label>
        <input type="time" id="departureTime" required>

        <label>Arrival Time</label>
        <input type="time" id="arrivalTime" required>

        <label>Max Seats</label>
        <input type="number" id="maxSeats" min="10" max="60" required>

        <label>Price (RM)</label>
        <input type="number" id="price" required>

        <button class="btn" type="submit">Add Route</button>
      </form>
    </div>

    <div class="card">
      <h2>Available Routes</h2>
      <table id="routeTable" border="1" width="100%" style="border-collapse: collapse;">
        <thead>
          <tr>
            <th>Route</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Seats</th>
            <th>Price (RM)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <div class="footer">
    © 2025 J&H Transports - Project by Jordan & Haua - Universiti Teknologi PETRONAS
  </div>

  <script src="assets/js/main.js"></script>

</body>
</html>
